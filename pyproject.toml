[project]
authors = [
    { name = "Kai Schleicher", email = "kai.schleicher@unibas.ch" },
    { name = "Niko Ehrenfeuchter", email = "nikolaus.ehrenfeuchter@unibas.ch" },
]
description = "Simple GUI for downloading objects from an OMERO server."
name = "omero-downloader"
requires-python = ">=3.11,<3.12.0a0"
version = "0.2.1.a11"
readme = "README.md"
dependencies = [
    "ttkbootstrap>=1.20.2.a0",
    "zeroc-ice==3.6.5",
    "omero-py>=5.20.0,<6",
    "click>=8.2.1,<9",
]

[project.scripts]
omero-downloader-gui = "omero_downloader.cli:launch_gui"
download-pdi = "omero_downloader.cli:download_pdi"


[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[tool.ruff.lint]
select = [
    "D",
    "D212", # summary lines must be on the first physical line of the docstring
    "D401", # imperative mood for all docstrings
    "D415", # summary line has to end in a punctuation mark
    "D417", # require documentation for _all_ function parameters
]

ignore = [
    "D202", # no blank lines allowed after function docstring
    ## D211 conflicts with ruff's formatting as of 2025-04-14, so don't use it:
    # "D211",  # no blank lines allowed before class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.pixi.workspace]
channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/imcf",
]
platforms = ["linux-64", "win-64"]
preview = ["pixi-build"]

[tool.pixi.pypi-dependencies]
# ttkbootstrap = ">=1.20.2"
omero_downloader = { path = ".", editable = true }

[tool.pixi.dependencies]
zeroc-ice = "==3.6.5"
omero-py = ">=5.20.0,<6"
click = ">=8.2.1,<9"
ttkbootstrap = ">=1.20.2a0,<2"

[tool.pixi.package]
name = "omero-downloader"
version = "0.2.1.a11"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "==0.4.8" }

[tool.pixi.package.build.config]
ignore-pypi-mapping = false

[tool.pixi.package.host-dependencies]
hatchling = "==1.26.3"
uv = "*"
python = "3.11.*"

[tool.pixi.package.run-dependencies]
ttkbootstrap = ">=1.20.2.a0"
# zeroc-ice = "==3.6.5"
# omero-py = ">=5.20.0,<6"
# click = ">=8.2.1,<9"
